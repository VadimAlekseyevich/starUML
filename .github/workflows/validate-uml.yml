name: Validate StarUML coursework

on:
  push:
    branches: [main]
    paths:
      - "urban-development-coursework/**"
      - ".github/workflows/validate-uml.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urban-development-coursework
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild UML
        run: python scripts/build_uml.py

      - name: Ensure dist is reproducible
        run: git diff --exit-code -- dist/urban_development.uml

      - name: Structural validation
        run: |
          python scripts/validate_uml.py dist/urban_development.uml \
            --registry model/registry.json \
            --forbid кредит \
            --forbid заявк \
            --forbid платеж \
            --forbid банков

      - name: Methodology audit
        run: |
          python scripts/audit_functionality.py dist/urban_development.uml \
            --traceability model/traceability.json
