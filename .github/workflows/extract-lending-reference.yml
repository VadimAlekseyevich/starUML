name: Extract lending reference library

on:
  push:
    branches: [main]
    paths:
      - "lending.uml"
      - "urban-development-coursework/scripts/extract_lending_examples.py"
      - ".github/workflows/extract-lending-reference.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract every lending diagram
        run: |
          python urban-development-coursework/scripts/extract_lending_examples.py \
            "lending.uml" \
            "urban-development-coursework/reference"

      - name: Commit generated reference library
        run: |
          git config user.name "uml-docs-bot"
          git config user.email "uml-docs-bot@users.noreply.github.com"
          git add urban-development-coursework/reference/generated
          if git diff --cached --quiet; then
            echo "No lending reference changes"
            exit 0
          fi
          git commit -m "Generate lending diagram reference library"
          git push
